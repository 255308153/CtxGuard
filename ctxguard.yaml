server:
  host: "127.0.0.1"
  port: 8787
  timeout_seconds: 180
  log_level: "INFO"
  cors_origins:
    - "http://localhost:*"
    - "http://127.0.0.1:*"

upstream:
  default_provider: "deepseek"
  providers:
    codex:
      base_url: "https://api.super-nb.me"
      api_key_env: "CODEX_API_KEY"
    deepseek:
      base_url: "https://api.deepseek.com"
      api_key_env: "DEEPSEEK_API_KEY"
    grok:
      base_url: "https://api.x.ai/v1"
      api_key_env: "XAI_API_KEY"
    anthropic:
      base_url: "https://api.anthropic.com"
      api_key_env: "ANTHROPIC_API_KEY"
    openai:
      base_url: "https://api.openai.com"
      api_key_env: "OPENAI_API_KEY"
    antigravity:
      base_url: "http://127.0.0.1:8045/v1"
      api_key_env: "ANTIGRAVITY_API_KEY"

dedup:
  enabled: true
  min_chars: 120
  exclude_patterns:
    - "*.env*"
    - "*secret*"
    - "*credential*"
  tool_injection:
    enabled: true
    tool_name: "ctx_expand"
    description: "Expand compressed context reference by ref_id if you need full details."

structural_compression:
  log_cleaner:
    enabled: true
    strip_ansi: true
    merge_progress_bars: true
    fold_repeated_stacktraces: true
    stacktrace_threshold: 3

  json_compressor:
    enabled: true
    min_array_length: 3
    ignore_keys:
      - "error"

  ast_compressor:
    enabled: true
    min_lines: 35
    preserve_docstrings: true

  git_diff:
    enabled: true
    min_lines: 15
    max_context_lines: 1

adaptive_pipeline:
  enabled: true
  levels:
    - name: "level_1"
      max_tokens: 16384
      compression_mode: "lossless"
      prune_ratio: 1.0
    - name: "level_2"
      max_tokens: 65536
      compression_mode: "lightweight"
      prune_ratio: 0.85
    - name: "level_3"
      max_tokens: 200000
      compression_mode: "deep"
      prune_ratio: 0.60
      use_onnx: false
  protected_keywords:
    - "CRITICAL"
    - "FATAL"
    - "TODO"
    - "FIXME"
    - "EXCEPTION"

cache_guard:
  freeze_system_prompt: true
  freeze_prefix_rounds: 2
  auto_anthropic_cache_control: true

learn:
  storage_db: ".ctxguard.db"
  detect_loop_threshold: 2
  target_files:
    - path: "AGENTS.md"
      marker: "CTXGUARD_AUTO_RULES"
    - path: "INSTRUCTIONS.md"
      marker: "CTXGUARD_AUTO_RULES"
    - path: ".pi/rules.md"
      marker: "CTXGUARD_AUTO_RULES"
    - path: "CLAUDE.local.md"
      marker: "CTXGUARD_AUTO_RULES"
    - path: ".cursorrules"
      marker: "CTXGUARD_AUTO_RULES"
    - path: ".windsurfrules"
      marker: "CTXGUARD_AUTO_RULES"
