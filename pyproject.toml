[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxguard"
version = "0.2.2"
description = "CtxGuard: Ultra-lightweight, zero-dependency LLM Context Optimization & Guardian Proxy"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CtxGuard Team" }
]
keywords = ["llm", "context-compression", "prompt-cache", "proxy", "token-optimization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "orjson>=3.9.15",
    "pyyaml>=6.0.1",
    "jieba>=0.42.1",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
ctxguard = "ctxguard.cli.main:main"

[tool.setuptools.packages.find]
include = ["ctxguard*"]
exclude = ["references*", "tests*", "benchmarks*", "面试问答*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
